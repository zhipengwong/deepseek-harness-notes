<svg width="1360" height="552" viewBox="0 0 680 276" xmlns="http://www.w3.org/2000/svg">
<title>一套核心两个入口</title>
<desc>命令行入口和本地 HTTP 入口共用同一份方法清单与共享核心。入口只解析参数和装配载体，业务逻辑不重复。</desc>
<rect x="0" y="0" width="680" height="276" fill="#FFFFFF"/>
<g font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif">

<rect x="52" y="20" width="256" height="62" rx="12" fill="#EAF2FE" stroke="#9CC2F0" stroke-width="0.6"/>
<text x="180" y="41" font-size="15" font-weight="600" fill="#174A8B" text-anchor="middle" dominant-baseline="central">命令行入口</text>
<text x="180" y="64" font-family="'SFMono-Regular', Menlo, monospace" font-size="12" fill="#3A6DB0" text-anchor="middle" dominant-baseline="central">argv → 直接调用</text>

<rect x="372" y="20" width="256" height="62" rx="12" fill="#FDF1DE" stroke="#EBC684" stroke-width="0.6"/>
<text x="500" y="41" font-size="15" font-weight="600" fill="#8A5A16" text-anchor="middle" dominant-baseline="central">HTTP 入口</text>
<text x="500" y="64" font-family="'SFMono-Regular', Menlo, monospace" font-size="12" fill="#A5732A" text-anchor="middle" dominant-baseline="central">endpoint + args → RPC</text>

<line x1="180" y1="84" x2="270" y2="106" stroke="#9B9A95" stroke-width="1.2"/>
<path d="M270 106 l-9 -2 l6 -7 z" fill="#9B9A95"/>
<line x1="500" y1="84" x2="410" y2="106" stroke="#9B9A95" stroke-width="1.2"/>
<path d="M410 106 l9 -2 l-6 -7 z" fill="#9B9A95"/>

<rect x="110" y="110" width="460" height="58" rx="12" fill="#E7F4EE" stroke="#96CBAE" stroke-width="0.6"/>
<text x="340" y="131" font-size="15" font-weight="600" fill="#1E6B45" text-anchor="middle" dominant-baseline="central">统一调用形状</text>
<text x="340" y="153" font-family="'SFMono-Regular', Menlo, monospace" font-size="12" fill="#3D855F" text-anchor="middle" dominant-baseline="central">invoke(endpoint, args)　方法清单只有一份</text>

<line x1="340" y1="170" x2="340" y2="194" stroke="#9B9A95" stroke-width="1.2"/>
<path d="M340 194 l-4 -8 h8 z" fill="#9B9A95"/>

<rect x="110" y="198" width="460" height="52" rx="12" fill="#F1EDFA" stroke="#C6B9E8" stroke-width="0.6"/>
<text x="340" y="216" font-size="14" font-weight="600" fill="#574197" text-anchor="middle" dominant-baseline="central">共享核心</text>
<text x="340" y="237" font-size="12" fill="#7765B3" text-anchor="middle" dominant-baseline="central">插件树　Session 日志　工具闸门　能力 seam</text>

<text x="340" y="268" font-size="13" fill="#5F5E5A" text-anchor="middle">换入口只动最外层。业务函数和核心状态不复制。</text>
</g>
</svg>
