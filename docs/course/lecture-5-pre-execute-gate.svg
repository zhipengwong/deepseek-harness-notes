<svg width="1360" height="460" viewBox="0 0 680 230" xmlns="http://www.w3.org/2000/svg">
<title>执行前的裁决闸门</title>
<desc>模型的 tool-call 请求先经过 pre-execute waterfall 裁决，结果分为允许一次、拒绝和转人工审批三种。</desc>
<rect x="0" y="0" width="680" height="230" fill="#FFFFFF"/>
<g font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif">
<rect x="24" y="86" width="186" height="74" rx="12" fill="#EAF2FE" stroke="#9CC2F0" stroke-width="0.6"/>
<text x="117" y="114" font-size="15" font-weight="600" fill="#174A8B" text-anchor="middle" dominant-baseline="central">模型 tool-call</text>
<text x="117" y="138" font-size="12" fill="#3A6DB0" text-anchor="middle" dominant-baseline="central">请求调用工具</text>

<rect x="247" y="86" width="186" height="74" rx="12" fill="#FDF1DE" stroke="#EBC684" stroke-width="0.6"/>
<text x="340" y="114" font-size="15" font-weight="600" fill="#8A5A16" text-anchor="middle" dominant-baseline="central">pre-execute</text>
<text x="340" y="138" font-size="12" fill="#A5732A" text-anchor="middle" dominant-baseline="central">waterfall 裁决</text>

<rect x="482" y="20" width="174" height="50" rx="10" fill="#E7F4EE" stroke="#96CBAE" stroke-width="0.6"/>
<text x="569" y="45" font-size="14" font-weight="600" fill="#1E6B45" text-anchor="middle" dominant-baseline="central">允许一次</text>

<rect x="482" y="98" width="174" height="50" rx="10" fill="#FBEAEA" stroke="#EBB0B0" stroke-width="0.6"/>
<text x="569" y="123" font-size="14" font-weight="600" fill="#A33A3A" text-anchor="middle" dominant-baseline="central">拒绝</text>

<rect x="482" y="176" width="174" height="50" rx="10" fill="#EAF2FE" stroke="#9CC2F0" stroke-width="0.6"/>
<text x="569" y="201" font-size="14" font-weight="600" fill="#174A8B" text-anchor="middle" dominant-baseline="central">转人工审批</text>

<line x1="212" y1="123" x2="244" y2="123" stroke="#9B9A95" stroke-width="1.2"/>
<path d="M244 123 l-7 -4 v8 z" fill="#9B9A95"/>
<path d="M435 123 C458 123 458 45 479 45" fill="none" stroke="#9B9A95" stroke-width="1.2"/>
<path d="M479 45 l-7 -3 v6 z" fill="#9B9A95"/>
<line x1="435" y1="123" x2="479" y2="123" stroke="#9B9A95" stroke-width="1.2"/>
<path d="M479 123 l-7 -4 v8 z" fill="#9B9A95"/>
<path d="M435 123 C458 123 458 201 479 201" fill="none" stroke="#9B9A95" stroke-width="1.2"/>
<path d="M479 201 l-7 -3 v6 z" fill="#9B9A95"/>
</g>
</svg>
