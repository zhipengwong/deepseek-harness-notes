<svg width="1360" height="362" viewBox="0 0 680 181" xmlns="http://www.w3.org/2000/svg">
<title>工具进入模型视野的三步链路</title>
<desc>插件注册工具，平台每步组装清单进提示词，模型返回 tool-call 内容块。description 决定模型是否选用工具。</desc>
<rect x="0" y="0" width="680" height="181" fill="#FFFFFF"/>
<g font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif">
<rect x="24" y="40" width="186" height="74" rx="12" fill="#EAF2FE" stroke="#9CC2F0" stroke-width="0.6"/>
<text x="117" y="68" font-size="15" font-weight="600" fill="#174A8B" text-anchor="middle" dominant-baseline="central">插件注册</text>
<text x="117" y="92" font-family="'SFMono-Regular', Menlo, monospace" font-size="12" fill="#3A6DB0" text-anchor="middle" dominant-baseline="central">ctx.tools.register</text>

<rect x="247" y="40" width="186" height="74" rx="12" fill="#E7F4EE" stroke="#96CBAE" stroke-width="0.6"/>
<text x="340" y="68" font-size="15" font-weight="600" fill="#1E6B45" text-anchor="middle" dominant-baseline="central">清单进提示词</text>
<text x="340" y="92" font-size="12" fill="#3D855F" text-anchor="middle" dominant-baseline="central">每步 resolve 后组装</text>

<rect x="470" y="40" width="186" height="74" rx="12" fill="#FDF1DE" stroke="#EBC684" stroke-width="0.6"/>
<text x="563" y="68" font-size="15" font-weight="600" fill="#8A5A16" text-anchor="middle" dominant-baseline="central">模型返回调用</text>
<text x="563" y="92" font-family="'SFMono-Regular', Menlo, monospace" font-size="12" fill="#A5732A" text-anchor="middle" dominant-baseline="central">tool-call 内容块</text>

<line x1="212" y1="77" x2="244" y2="77" stroke="#9B9A95" stroke-width="1.2"/>
<path d="M244 77 l-7 -4 v8 z" fill="#9B9A95"/>
<line x1="435" y1="77" x2="467" y2="77" stroke="#9B9A95" stroke-width="1.2"/>
<path d="M467 77 l-7 -4 v8 z" fill="#9B9A95"/>

<text x="340" y="146" font-size="13" fill="#5F5E5A" text-anchor="middle">description 决定模型是否选用工具。工具名不参与判断。</text>
</g>
</svg>
