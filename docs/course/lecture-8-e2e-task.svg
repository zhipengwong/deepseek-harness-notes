<svg width="1360" height="600" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg">
<title>一次任务穿过六块</title>
<desc>入口把消息放进 inbox，driver 打开轮次与步骤，Session 日志记下事实，提示词从日志派生并带上工具 schema，模型产出工具申请，闸门裁决并执行，结果回写日志后进入下一步。日志是唯一真源。</desc>
<rect x="0" y="0" width="680" height="300" fill="#FFFFFF"/>
<g font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif">

<rect x="18" y="30" width="104" height="58" rx="10" fill="#EAF2FE" stroke="#9CC2F0" stroke-width="0.6"/>
<text x="70" y="50" font-size="14" font-weight="600" fill="#174A8B" text-anchor="middle" dominant-baseline="central">入口与 inbox</text>
<text x="70" y="70" font-size="11" fill="#3A6DB0" text-anchor="middle" dominant-baseline="central">消息入队</text>

<rect x="146" y="30" width="112" height="58" rx="10" fill="#F1EDFA" stroke="#C6B9E8" stroke-width="0.6"/>
<text x="202" y="50" font-size="14" font-weight="600" fill="#574197" text-anchor="middle" dominant-baseline="central">driver</text>
<text x="202" y="70" font-family="'SFMono-Regular', Menlo, monospace" font-size="11" fill="#7765B3" text-anchor="middle" dominant-baseline="central">turn / step</text>

<rect x="282" y="30" width="128" height="58" rx="10" fill="#E7F4EE" stroke="#96CBAE" stroke-width="0.6"/>
<text x="346" y="50" font-size="14" font-weight="600" fill="#1E6B45" text-anchor="middle" dominant-baseline="central">Session 日志</text>
<text x="346" y="70" font-size="11" fill="#3D855F" text-anchor="middle" dominant-baseline="central">唯一真源 append-only</text>

<rect x="434" y="30" width="112" height="58" rx="10" fill="#FDF1DE" stroke="#EBC684" stroke-width="0.6"/>
<text x="490" y="50" font-size="14" font-weight="600" fill="#8A5A16" text-anchor="middle" dominant-baseline="central">派生提示词</text>
<text x="490" y="70" font-size="11" fill="#A5732A" text-anchor="middle" dominant-baseline="central">历史 + 工具 schema</text>

<rect x="570" y="30" width="92" height="58" rx="10" fill="#EEF3F7" stroke="#B9CBD9" stroke-width="0.6"/>
<text x="616" y="50" font-size="14" font-weight="600" fill="#2C5876" text-anchor="middle" dominant-baseline="central">模型</text>
<text x="616" y="70" font-size="11" fill="#4A7696" text-anchor="middle" dominant-baseline="central">流式响应</text>

<line x1="122" y1="59" x2="146" y2="59" stroke="#9B9A95" stroke-width="1.2"/>
<path d="M146 59 l-8 -4 l0 8 z" fill="#9B9A95"/>
<line x1="258" y1="59" x2="282" y2="59" stroke="#9B9A95" stroke-width="1.2"/>
<path d="M282 59 l-8 -4 l0 8 z" fill="#9B9A95"/>
<line x1="410" y1="59" x2="434" y2="59" stroke="#9B9A95" stroke-width="1.2"/>
<path d="M434 59 l-8 -4 l0 8 z" fill="#9B9A95"/>
<line x1="546" y1="59" x2="570" y2="59" stroke="#9B9A95" stroke-width="1.2"/>
<path d="M570 59 l-8 -4 l0 8 z" fill="#9B9A95"/>

<path d="M616 88 L616 199 L546 199" fill="none" stroke="#9B9A95" stroke-width="1.2"/>
<path d="M546 199 l8 -4 l0 8 z" fill="#9B9A95"/>

<rect x="434" y="170" width="112" height="58" rx="10" fill="#FDEDED" stroke="#EEB9B9" stroke-width="0.6"/>
<text x="490" y="190" font-size="14" font-weight="600" fill="#9C3333" text-anchor="middle" dominant-baseline="central">审批闸门</text>
<text x="490" y="210" font-size="11" fill="#B85A5A" text-anchor="middle" dominant-baseline="central">失败关闭</text>

<rect x="282" y="170" width="128" height="58" rx="10" fill="#E7F5F6" stroke="#A8D4D8" stroke-width="0.6"/>
<text x="346" y="190" font-size="14" font-weight="600" fill="#26656E" text-anchor="middle" dominant-baseline="central">工具执行</text>
<text x="346" y="210" font-size="11" fill="#3F8892" text-anchor="middle" dominant-baseline="central">按提交顺序回灌</text>

<rect x="146" y="170" width="112" height="58" rx="10" fill="#E7F4EE" stroke="#96CBAE" stroke-width="0.6"/>
<text x="202" y="190" font-size="14" font-weight="600" fill="#1E6B45" text-anchor="middle" dominant-baseline="central">结果回写</text>
<text x="202" y="210" font-family="'SFMono-Regular', Menlo, monospace" font-size="11" fill="#3D855F" text-anchor="middle" dominant-baseline="central">tool/result</text>

<line x1="434" y1="199" x2="410" y2="199" stroke="#9B9A95" stroke-width="1.2"/>
<path d="M410 199 l8 -4 l0 8 z" fill="#9B9A95"/>
<line x1="282" y1="199" x2="258" y2="199" stroke="#9B9A95" stroke-width="1.2"/>
<path d="M258 199 l8 -4 l0 8 z" fill="#9B9A95"/>

<path d="M202 170 L298 88" fill="none" stroke="#3D855F" stroke-width="1.2" stroke-dasharray="4 3"/>
<path d="M298 88 l-9 2 l5 7 z" fill="#3D855F"/>
<text x="252" y="126" font-size="11" fill="#3D855F" text-anchor="middle">先落日志</text>

<path d="M146 199 L8 199 L8 59 L18 59" fill="none" stroke="#9B9A95" stroke-width="1.2"/>
<path d="M18 59 l8 -4 l0 8 z" fill="#9B9A95"/>
<text x="34" y="128" font-size="11" fill="#6B6A66" text-anchor="middle">下一轮</text>

<text x="340" y="266" font-size="13" fill="#5F5E5A" text-anchor="middle">模型可见事实先落日志，再从日志派生。日志是唯一真源，回放即重算。</text>
<text x="340" y="286" font-size="11" fill="#8A8985" text-anchor="middle">六块各守一段，没有谁越过边界改别人的状态。</text>
</g>
</svg>
