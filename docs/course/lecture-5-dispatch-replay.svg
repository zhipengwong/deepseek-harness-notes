<svg width="1360" height="362" viewBox="0 0 680 181" xmlns="http://www.w3.org/2000/svg">
<title>执行调度与结果回灌</title>
<desc>并行调用进入有界滚动池，上限 10 路。exclusive 调用作为屏障等池排空。执行可以乱序，结果按模型顺序提交。</desc>
<rect x="0" y="0" width="680" height="181" fill="#FFFFFF"/>
<g font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif">
<rect x="24" y="40" width="186" height="74" rx="12" fill="#E7F4EE" stroke="#96CBAE" stroke-width="0.6"/>
<text x="117" y="68" font-size="15" font-weight="600" fill="#1E6B45" text-anchor="middle" dominant-baseline="central">并行池</text>
<text x="117" y="92" font-size="12" fill="#3D855F" text-anchor="middle" dominant-baseline="central">parallel，上限 10</text>

<rect x="247" y="40" width="186" height="74" rx="12" fill="#FDF1DE" stroke="#EBC684" stroke-width="0.6"/>
<text x="340" y="68" font-size="15" font-weight="600" fill="#8A5A16" text-anchor="middle" dominant-baseline="central">exclusive 屏障</text>
<text x="340" y="92" font-size="12" fill="#A5732A" text-anchor="middle" dominant-baseline="central">先排空当前池</text>

<rect x="470" y="40" width="186" height="74" rx="12" fill="#EAF2FE" stroke="#9CC2F0" stroke-width="0.6"/>
<text x="563" y="68" font-size="15" font-weight="600" fill="#174A8B" text-anchor="middle" dominant-baseline="central">结果回灌</text>
<text x="563" y="92" font-size="12" fill="#3A6DB0" text-anchor="middle" dominant-baseline="central">按模型顺序提交</text>

<line x1="212" y1="77" x2="244" y2="77" stroke="#9B9A95" stroke-width="1.2"/>
<path d="M244 77 l-7 -4 v8 z" fill="#9B9A95"/>
<line x1="435" y1="77" x2="467" y2="77" stroke="#9B9A95" stroke-width="1.2"/>
<path d="M467 77 l-7 -4 v8 z" fill="#9B9A95"/>

<text x="340" y="142" font-size="12.5" fill="#5F5E5A" text-anchor="middle">执行可以乱序，结果顺序固定。取消时停新调用，为跳过的调用写合成错误结果。</text>
<text x="340" y="163" font-size="12.5" fill="#5F5E5A" text-anchor="middle">重试由插件决定，内核不内置。压缩是单独环节，不进主干。</text>
</g>
</svg>
