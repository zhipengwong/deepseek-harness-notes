<svg width="100%" viewBox="0 0 680 430" role="img" xmlns="http://www.w3.org/2000/svg">
<title>一份日志派生出模型视图与人类视图两个投影</title>
<desc>左侧 append-only 日志有 8 条事件，seq7 的摘要事件遮蔽 seq2 到 seq4；右侧模型视图只看到 seq1、seq7、seq5、seq8，人类视图看到所有 append-origin 事件。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="40" y="44" width="270" height="366" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="56" y="66" fill="#0C447C" font-size="13" font-weight="500">session log · 只追加 · 唯一真源</text>
<rect x="56" y="78" width="238" height="32" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="66" y="94" fill="#2C2C2A" font-size="12" dominant-baseline="central">seq1  system/message</text>
<rect x="56" y="115" width="238" height="32" rx="6" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="66" y="131" fill="#185FA5" font-size="12" dominant-baseline="central">seq2  user/message（遮蔽）</text>
<rect x="56" y="152" width="238" height="32" rx="6" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="66" y="168" fill="#185FA5" font-size="12" dominant-baseline="central">seq3  assistant/message（遮蔽）</text>
<rect x="56" y="189" width="238" height="32" rx="6" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="66" y="205" fill="#185FA5" font-size="12" dominant-baseline="central">seq4  tool/result（遮蔽）</text>
<rect x="56" y="226" width="238" height="32" rx="6" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
<text x="66" y="242" fill="#0C447C" font-size="12" dominant-baseline="central">seq5  assistant/message</text>
<rect x="56" y="263" width="238" height="32" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="66" y="279" fill="#633806" font-size="12" dominant-baseline="central">seq6  compaction/summary（log-only）</text>
<rect x="56" y="300" width="238" height="32" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="66" y="316" fill="#3C3489" font-size="12" dominant-baseline="central">seq7  user/message（replace 2–4）</text>
<rect x="56" y="337" width="238" height="32" rx="6" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
<text x="66" y="353" fill="#0C447C" font-size="12" dominant-baseline="central">seq8  assistant/message</text>
<path d="M310 200 L384 130" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M310 320 L384 320" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="390" y="70" width="250" height="160" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="406" y="94" fill="#3C3489" font-size="13" font-weight="500">模型可见 surface</text>
<text x="406" y="118" fill="#3C3489" font-size="12">seq1 → seq7 → seq5 → seq8</text>
<text x="406" y="142" fill="#3C3489" font-size="12">seq2–4 被遮蔽，不进上下文</text>
<text x="406" y="166" fill="#3C3489" font-size="12">摘要替代旧消息，省 token</text>
<text x="406" y="190" fill="#3C3489" font-size="12">入口 deriveMessages()</text>
<rect x="390" y="252" width="250" height="160" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="406" y="276" fill="#085041" font-size="13" font-weight="500">人类可读 transcript</text>
<text x="406" y="300" fill="#085041" font-size="12">只读 append-origin 事件</text>
<text x="406" y="324" fill="#085041" font-size="12">seq2–4 仍在，用户看得到</text>
<text x="406" y="348" fill="#085041" font-size="12">替换副本不给模型以外的人看</text>
<text x="406" y="372" fill="#085041" font-size="12">入口 isAppendSurfaceEvent()</text>
</svg>
